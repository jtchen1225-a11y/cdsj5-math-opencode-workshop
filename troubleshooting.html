<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>疑難排解與 30–40 人現場 SOP｜小學數學教師 OpenCode 培訓</title>
  <meta name="description" content="針對 2 小時小學數學教師實操工作坊設計的高頻問題速查。嚴格採用「現象、原因、一項動作、驗證步驟」4 步格式，並含 30–40 人現場故障分級處理指南。">
  <style>
    :root {
      --bg: #F7F4EC;
      --surface: #FFFDF8;
      --card: #FFFFFF;

      --text-primary: #182436;
      --text-secondary: #59636E;

      --school-green: #1F5948;
      --school-navy: #172437;

      --ai-orange: #F26A21;
      --heritage-gold: #C69A3B;
      --tech-blue: #2787C8;

      --border: #E7E0D5;
      --soft-green: #EEF5F1;
      --soft-orange: #FFF2E8;
      --soft-gold: #FFF8E5;

      --shadow:
        0 8px 30px rgba(24, 36, 54, 0.07);

      /* 相容映射 (Compatibility Aliases) */
      --text: var(--text-primary);
      --muted: var(--text-secondary);
      --line: var(--border);
      --line-light: var(--border);
      --key: var(--ai-orange);
      --hi: var(--heritage-gold);
      --blue: var(--tech-blue);
      --success: var(--school-green);
      --danger: #DC2626;
      --bg2: var(--surface);
      --surface-hover: var(--soft-green);
      --chalk-bg: #0F1612;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    header.site-header {
      background: rgba(247, 244, 236, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--school-navy);
      font-weight: 700;
      font-size: 1.05rem;
    }
    .brand-badge {
      background: var(--ai-orange);
      color: #FFFFFF;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .nav-links {
      display: flex;
      gap: 10px;
      list-style: none;
      margin: 0;
      padding: 0;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .nav-links a:hover {
      color: var(--school-navy);
      background: var(--soft-green);
    }
    .nav-links a.active {
      color: var(--school-green);
      background: var(--soft-green);
      border-bottom: 2px solid var(--school-green);
      font-weight: 700;
    }

    /* Page Hero */
    .page-hero {
      padding: 40px 0 28px;
      border-bottom: 1px solid var(--border);
    }
    .page-hero h1 {
      font-size: 2.1rem;
      margin: 0 0 12px 0;
      color: var(--school-navy);
    }
    .page-hero p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      margin: 0;
      max-width: 820px;
    }

    /* Important Principles Banner */
    .rule-banner {
      background: var(--soft-orange);
      border: 1px solid var(--ai-orange);
      border-radius: 8px;
      padding: 16px 20px;
      margin: 24px 0;
      color: var(--text-primary);
    }
    .rule-banner strong {
      color: var(--ai-orange);
      font-size: 1.05rem;
    }

    /* Problem Card */
    .trouble-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px;
      margin: 20px 0;
      box-shadow: var(--shadow);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .trouble-card:hover {
      border-color: var(--ai-orange);
      box-shadow: 0 12px 28px rgba(24, 36, 54, 0.12);
    }
    .trouble-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .trouble-badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--soft-green);
      color: var(--school-navy);
      border: 1px solid var(--border);
    }
    .trouble-badge.critical {
      background: #FEE2E2;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .trouble-title {
      font-size: 1.18rem;
      margin: 0;
      color: var(--school-navy);
      font-weight: 700;
    }

    /* 4-Step troubleshooting grid */
    .trouble-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .step-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 0.88rem;
    }
    .step-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .symptom .step-label { color: #DC2626; }
    .cause .step-label { color: #D97706; }
    .action .step-label { color: #059669; }
    .verify .step-label { color: #2563EB; }

    .step-box p {
      margin: 0;
      color: var(--text-primary);
      line-height: 1.5;
    }
    .step-box code {
      background: #182436;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: #60D5FA;
    }

    /* Tables */
    .tw {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 20px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
      font-size: 0.9rem;
    }
    th {
      background: var(--soft-green);
      color: var(--school-green);
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      vertical-align: top;
      background: var(--card);
    }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: var(--surface); }

    /* Section divider */
    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--school-navy);
      margin: 36px 0 8px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-subtitle {
      color: var(--text-secondary);
      margin: 0 0 20px 0;
      font-size: 0.95rem;
    }

    /* Footer */
    footer.site-footer {
      border-top: 1px solid var(--border);
      padding: 36px 0;
      margin-top: 48px;
      margin-bottom: 70px;
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 0.88rem;
    }
    /* ==========================================================
       CLASSROOM TEACHING TOOLBAR (課堂授課教具列)
       ========================================================== */
    .classroom-toolbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 253, 248, 0.94);
      backdrop-filter: blur(14px);
      border: 1.5px solid var(--border);
      box-shadow: 0 10px 36px rgba(24, 36, 54, 0.12), 0 2px 8px rgba(24, 36, 54, 0.06);
      border-radius: 40px;
      padding: 6px 12px;
      transition: all 0.25s ease;
    }
    .classroom-toolbar:hover {
      border-color: var(--school-green);
      box-shadow: 0 14px 42px rgba(24, 36, 54, 0.18);
    }
    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      color: var(--school-navy);
      border: none;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .tool-btn:hover {
      background: var(--soft-green);
      color: var(--school-green);
    }
    .tool-btn.active {
      background: var(--school-green);
      color: #FFF;
    }
    .tool-icon {
      font-size: 1.1rem;
      display: inline-block;
    }
    .tool-text {
      font-size: 0.82rem;
      letter-spacing: 0.3px;
    }
    .toolbar-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 2px;
    }
    /* Spotlight Overlay (課堂聚光燈) */
    #spotlight-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9980;
      display: none;
      background: radial-gradient(circle 140px at var(--mouse-x, 50vw) var(--mouse-y, 50vh), transparent 0%, rgba(0, 0, 0, 0.78) 100%);
    }
    #spotlight-overlay.active {
      display: block;
    }

    /* Laser Pointer */
    #laser-dot {
      position: fixed;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle, #FF2222 0%, #FF0000 65%, rgba(255, 0, 0, 0) 100%);
      box-shadow: 0 0 14px 4px #FF2222, 0 0 26px 8px rgba(255, 50, 50, 0.6);
      pointer-events: none;
      z-index: 99999;
      display: none;
      transform: translate(-50%, -50%);
    }
    body.laser-active, body.laser-active * {
      cursor: crosshair !important;
    }

    /* Screen Drawing Canvas */
    #chalk-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9990;
      pointer-events: none;
      display: none;
    }
    #chalk-canvas.drawing-active {
      pointer-events: auto;
      cursor: crosshair;
      display: block;
    }
    .pen-palette {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      background: #1A1E24;
      border: 1px solid #38BDF8;
      border-radius: 30px;
      padding: 6px 14px;
      display: none;
      gap: 12px;
      align-items: center;
      z-index: 9995;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
    }
    .pen-palette.show {
      display: flex;
    }
    .pen-color-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .pen-color-dot:hover, .pen-color-dot.active {
      transform: scale(1.3);
      border-color: #FFF;
    }

    /* Blackboard Fullscreen Deck Modal */
    #deck-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0F1612 0%, #060907 100%);
      z-index: 10000;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      color: #F5F7FA;
      padding: 24px 36px;
      user-select: none;
    }
    #deck-modal.active {
      display: flex;
    }
    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 14px;
      flex-shrink: 0;
    }
    .deck-title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .deck-badge {
      background: var(--key);
      color: #000;
      padding: 3px 10px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.5px;
    }
    .deck-category-label {
      color: var(--hi);
      font-size: 1.05rem;
      font-weight: 700;
    }
    .deck-controls-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .deck-counter {
      font-size: 1.15rem;
      font-weight: 800;
      color: #38BDF8;
      font-family: Consolas, monospace;
    }
    .deck-icon-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #FFF;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .deck-icon-btn:hover {
      background: var(--key);
      color: #000;
      border-color: var(--key);
    }
    .deck-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 24px;
      overflow-y: auto;
    }
    .deck-slide-box {
      width: 82vw;
      max-width: 1440px;
      min-height: 75vh;
      max-height: 82vh;
      box-sizing: border-box;
      background: radial-gradient(circle at top left, rgba(20, 32, 25, 0.96) 0%, rgba(10, 16, 13, 0.98) 100%);
      border: 2.5px solid rgba(52, 211, 153, 0.45);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95), 0 0 40px rgba(52, 211, 153, 0.15), inset 0 0 36px rgba(0, 0, 0, 0.7);
      border-radius: 20px;
      padding: 28px 38px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      animation: fadeInSlide 0.2s ease-out;
    }
    @keyframes fadeInSlide {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Dashboard 2-Column Grid */
    .deck-dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 390px;
      gap: 32px;
      align-items: stretch;
      flex: 1;
    }
    .deck-col-main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .deck-col-side {
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
      min-width: 320px;
    }

    /* Side Cards: Century Team & Details as Main Course */
    .deck-card-team, .deck-card-detail {
      background: rgba(14, 22, 18, 0.85);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s, border-color 0.2s;
    }
    .deck-card-team:hover, .deck-card-detail:hover {
      transform: translateY(-2px);
    }
    .deck-card-team {
      border: 1.5px solid rgba(251, 191, 36, 0.5);
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.08) 0%, rgba(14, 22, 18, 0.92) 100%);
    }
    .deck-card-detail {
      border: 1.5px solid rgba(56, 189, 248, 0.5);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.08) 0%, rgba(14, 22, 18, 0.92) 100%);
    }
    .card-side-header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 6px;
    }
    .card-side-icon {
      font-size: 1.25rem;
    }
    .deck-card-team .card-side-title {
      color: #FBBF24;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .deck-card-detail .card-side-title {
      color: #38BDF8;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .card-side-body {
      font-size: 0.96rem;
      line-height: 1.65;
      color: #E2E8F0;
    }
    .card-side-body strong {
      color: #FFF;
    }

    /* Bottom Banner */
    .deck-bottom-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    .banner-badge {
      background: rgba(52, 211, 153, 0.2);
      color: #34D399;
      border: 1px solid rgba(52, 211, 153, 0.45);
      font-size: 0.8rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .banner-quote {
      font-size: 0.95rem;
      color: #94A3B8;
      letter-spacing: 0.3px;
    }

    /* Typography */
    .deck-slide-h2 {
      font-size: 2.2rem;
      color: #FFF;
      margin: 0 0 12px 0;
      line-height: 1.3;
      font-weight: 800;
    }
    .deck-slide-h2 .highlight {
      color: var(--hi);
      text-shadow: 0 0 16px rgba(52, 211, 153, 0.4);
    }
    .deck-slide-desc {
      font-size: 1.25rem;
      line-height: 1.65;
      color: #CBD5E1;
      margin: 0 0 16px 0;
    }
    .deck-slide-list {
      font-size: 1.18rem;
      line-height: 1.75;
      color: #E2E8F0;
      padding-left: 24px;
      margin: 0;
    }
    .deck-slide-list li {
      margin-bottom: 10px;
    }
    .deck-slide-box code {
      background: rgba(56, 189, 248, 0.14);
      color: #38BDF8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 2px 8px;
      border-radius: 5px;
      font-family: Consolas, Monaco, monospace;
      font-weight: 700;
      font-size: 0.92em;
    }

    /* Vibrant Chalkboard Text Highlights */
    .hl-gold   { color: #FBBF24; font-weight: 800; text-shadow: 0 0 12px rgba(251, 191, 36, 0.35); }
    .hl-cyan   { color: #38BDF8; font-weight: 800; text-shadow: 0 0 12px rgba(56, 189, 248, 0.35); }
    .hl-green  { color: #4ADE80; font-weight: 800; text-shadow: 0 0 12px rgba(74, 222, 128, 0.35); }
    .hl-rose   { color: #FB7185; font-weight: 800; text-shadow: 0 0 12px rgba(251, 113, 133, 0.35); }
    .hl-purple { color: #C084FC; font-weight: 800; text-shadow: 0 0 12px rgba(192, 132, 252, 0.35); }
    .hl-badge  {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.85em;
      font-weight: 800;
      margin-right: 6px;
      vertical-align: middle;
    }
    .hl-badge.gold   { background: rgba(251, 191, 36, 0.2); color: #FBBF24; border: 1px solid rgba(251, 191, 36, 0.5); }
    .hl-badge.cyan   { background: rgba(56, 189, 248, 0.2); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.5); }
    .hl-badge.green  { background: rgba(74, 222, 128, 0.2); color: #4ADE80; border: 1px solid rgba(74, 222, 128, 0.5); }
    .hl-badge.rose   { background: rgba(251, 113, 133, 0.2); color: #FB7185; border: 1px solid rgba(251, 113, 133, 0.5); }
    .hl-badge.purple { background: rgba(192, 132, 252, 0.2); color: #C084FC; border: 1px solid rgba(192, 132, 252, 0.5); }

    /* Responsive */
    @media (max-width: 1024px) {
      .deck-dashboard-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .deck-col-side {
        min-width: auto;
      }
      .deck-slide-box {
        width: 92vw;
        padding: 24px;
        min-height: auto;
        max-height: 85vh;
      }
      .deck-slide-h2 {
        font-size: 1.7rem;
      }
      .deck-slide-desc {
        font-size: 1.1rem;
      }
      .deck-slide-list {
        font-size: 1.05rem;
      }
    }
                .deck-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 14px;
      flex-shrink: 0;
    }
    .deck-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #FFF;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .deck-nav-btn:hover {
      background: var(--key);
      color: #000;
      border-color: var(--key);
    }
    .deck-shortcuts-hint {
      font-size: 0.85rem;
      color: #88929A;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .deck-shortcuts-hint kbd {
      background: #1C2024;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid #3E4650;
      color: #FFF;
      font-family: monospace;
    }

    /* Help Modal */
    #help-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--card);
      border: 2px solid var(--school-green);
      border-radius: 12px;
      padding: 24px 30px;
      z-index: 10005;
      display: none;
      box-shadow: 0 16px 48px rgba(24, 36, 54, 0.2);
      max-width: 440px;
      width: 90%;
      color: var(--text-primary);
    }
    #help-modal.show { display: block; }
    #help-modal h3 { margin: 0 0 12px 0; color: var(--school-navy); }
    #help-modal table { width: 100%; border-collapse: collapse; }
    #help-modal td { padding: 6px 0; border: none; font-size: 0.9rem; color: var(--text-primary); background: transparent; }
    #help-modal kbd { background: var(--soft-green); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--school-green); font-family: monospace; font-weight: bold; }

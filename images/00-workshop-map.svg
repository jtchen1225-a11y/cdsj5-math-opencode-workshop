<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="auto">
  <defs>
    <linearGradient id="gradKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <linearGradient id="gradHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD400"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF6A00"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="340" rx="16" fill="#0E0E0E" stroke="#2A2A2A" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="30" y="24" width="220" height="28" rx="6" fill="#202020" stroke="#333333"/>
  <text x="40" y="43" fill="#FFD400" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="bold">2小時學習迴圈 2H LEARNING LOOP</text>

  <!-- Flow connecting lines -->
  <path d="M 215 130 L 255 130" stroke="#FF6A00" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 435 130 L 475 130" stroke="#FF6A00" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 655 130 L 695 130" stroke="#FF6A00" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <path d="M 785 185 L 785 220 A 15 15 0 0 1 770 235 L 705 235" stroke="#FF6A00" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 485 245 L 445 245" stroke="#FF6A00" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 265 245 L 225 245" stroke="#FF6A00" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 1: 真實教材 + AGENTS.md -->
  <g transform="translate(35, 75)" filter="url(#shadow)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#3A3A3A" stroke-width="1.5"/>
    <rect x="12" y="12" width="55" height="18" rx="4" fill="#332211" stroke="#FF6A00" stroke-width="0.8"/>
    <text x="18" y="25" fill="#FF8A00" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="bold">00–30分</text>
    <text x="14" y="52" fill="#FFFFFF" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="bold">1. 教材與規則</text>
    <text x="14" y="74" fill="#9AA0A6" font-family="'Noto Sans TC', sans-serif" font-size="11">讀取 materials/ PDF</text>
    <text x="14" y="92" fill="#9AA0A6" font-family="'Noto Sans TC', sans-serif" font-size="11">對齊 AGENTS.md 邊界</text>
  </g>

  <!-- Step 2: 確認需求 (task-spec.md) -->
  <g transform="translate(255, 75)" filter="url(#shadow)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#3A3A3A" stroke-width="1.5"/>
    <rect x="12" y="12" width="55" height="18" rx="4" fill="#332211" stroke="#FF6A00" stroke-width="0.8"/>
    <text x="18" y="25" fill="#FF8A00" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="bold">30–50分</text>
    <text x="14" y="52" fill="#FFFFFF" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="bold">2. 教師確認需求</text>
    <text x="14" y="74" fill="#9AA0A6" font-family="'Noto Sans TC', sans-serif" font-size="11">不超過 6 個關鍵問題</text>
    <text x="14" y="92" fill="#FFD400" font-family="'Noto Sans TC', sans-serif" font-size="11">寫入 requirements/</text>
  </g>

  <!-- Step 3: 第一次備課 (成果 1) -->
  <g transform="translate(475, 75)" filter="url(#shadow)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#FF6A00" stroke-width="2"/>
    <rect x="12" y="12" width="55" height="18" rx="4" fill="#FF6A00"/>
    <text x="18" y="25" fill="#000000" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="bold">成果 1</text>
    <text x="14" y="52" fill="#FFFFFF" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="bold">3. 第一次備課</text>
    <text x="14" y="74" fill="#FFD400" font-family="'Noto Sans TC', sans-serif" font-size="11">第 60 分鐘成果驗收</text>
    <text x="14" y="92" fill="#9AA0A6" font-family="'Noto Sans TC', sans-serif" font-size="11">output/01-first-version/</text>
  </g>

  <!-- Step 4: 做一次分層 (成果 2) -->
  <g transform="translate(695, 75)" filter="url(#shadow)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#FF6A00" stroke-width="2"/>
    <rect x="12" y="12" width="55" height="18" rx="4" fill="#FF6A00"/>
    <text x="18" y="25" fill="#000000" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="bold">成果 2</text>
    <text x="14" y="52" fill="#FFFFFF" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="bold">4. 做一次分層</text>
    <text x="14" y="74" fill="#9AA0A6" font-family="'Noto Sans TC', sans-serif" font-size="11">A支援 / B基準 / C挑戰</text>
    <text x="14" y="92" fill="#9AA0A6" font-family="'Noto Sans TC', sans-serif" font-size="11">output/02-differentiated/</text>
  </g>

  <!-- Step 7: 帶真實問題離場 -->
  <g transform="translate(35, 195)" filter="url(#shadow)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#FFD400" stroke-width="2"/>
    <rect x="12" y="12" width="70" height="18" rx="4" fill="#FFD400"/>
    <text x="16" y="25" fill="#000000" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="bold">下一場入口</text>
    <text x="14" y="52" fill="#FFFFFF" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="bold">7. 記錄課堂問題</text>
    <text x="14" y="74" fill="#FFD400" font-family="'Noto Sans TC', sans-serif" font-size="11">下一場培訓起點</text>
    <text x="14" y="92" fill="#9AA0A6" font-family="'Noto Sans TC', sans-serif" font-size="11">notes/next-workshop...</text>
  </g>

  <!-- Step 6: 再次重用 (成果 4) -->
  <g transform="translate(255, 195)" filter="url(#shadow)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#FF6A00" stroke-width="2"/>
    <rect x="12" y="12" width="55" height="18" rx="4" fill="#FF6A00"/>
    <text x="18" y="25" fill="#000000" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="bold">成果 4</text>
    <text x="14" y="52" fill="#FFFFFF" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="bold">6. 再次重用</text>
    <text x="14" y="74" fill="#9AA0A6" font-family="'Noto Sans TC', sans-serif" font-size="11">保留規則，套用新課</text>
    <text x="14" y="92" fill="#9AA0A6" font-family="'Noto Sans TC', sans-serif" font-size="11">output/04-reused/</text>
  </g>

  <!-- Step 5: 同步修訂 (成果 3) -->
  <g transform="translate(485, 195)" filter="url(#shadow)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#FF6A00" stroke-width="2"/>
    <rect x="12" y="12" width="55" height="18" rx="4" fill="#FF6A00"/>
    <text x="18" y="25" fill="#000000" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="bold">成果 3</text>
    <text x="14" y="52" fill="#FFFFFF" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="bold">5. 同步修訂</text>
    <text x="14" y="74" fill="#9AA0A6" font-family="'Noto Sans TC', sans-serif" font-size="11">條件變更，跨檔聯動</text>
    <text x="14" y="92" fill="#9AA0A6" font-family="'Noto Sans TC', sans-serif" font-size="11">output/03-revised/</text>
  </g>

  <!-- Verification Note -->
  <g transform="translate(695, 215)">
    <rect width="180" height="75" rx="8" fill="#1C150A" stroke="#FF6A00" stroke-dasharray="4 3"/>
    <text x="14" y="25" fill="#FFD400" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="bold">110-117分 教師驗收</text>
    <text x="14" y="45" fill="#E0E0E0" font-family="'Noto Sans TC', sans-serif" font-size="10">AI產出 ≠ 完成</text>
    <text x="14" y="60" fill="#FF6A00" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="bold">教師親自驗收才是完成！</text>
  </g>
</svg>
